<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#14532d">
<title>Visión Agropecuaria — Descargas de granos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌾</text></svg>">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --verde:#14532d; --verde2:#166534; --verde3:#22c55e;
  --trigo:#b45309; --bg:#f1f5f0; --card:#fff; --linea:#d5ded3;
  --txt:#14201a; --gris:#64748b; --rojo:#b91c1c;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:15px}
h1,h2,h3{margin:0}
button,input,select,textarea{font-family:inherit;font-size:inherit}

/* ---------- Encabezado ---------- */
.top{background:linear-gradient(135deg,var(--verde) 0%,var(--verde2) 60%,#15803d 100%);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.18)}
.top .marca{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;flex:0 0 40px;border-radius:10px;background:#fff;display:grid;place-items:center;font-size:24px}
.top h1{font-size:20px;letter-spacing:.4px;font-weight:800;line-height:1.1}
.top .sub{font-size:11.5px;opacity:.85;letter-spacing:2px;text-transform:uppercase}
.estado{margin-left:auto;font-size:11px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);padding:5px 10px;border-radius:20px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#86efac;box-shadow:0 0 8px #86efac}
.dot.off{background:#fca5a5;box-shadow:0 0 8px #fca5a5}

/* ---------- Pestañas ---------- */
.tabs{display:flex;background:#0f3d22;padding:0 8px;position:sticky;top:68px;z-index:49}
.tabs button{flex:1;background:none;border:0;color:#cfe8d8;padding:12px 6px;font-weight:600;font-size:14px;cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:#fff;border-bottom-color:var(--verde3)}

.wrap{max-width:1180px;margin:0 auto;padding:14px 12px 100px}
.card{background:var(--card);border:1px solid var(--linea);border-radius:14px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card > h3{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--verde2);margin-bottom:12px;font-weight:800;display:flex;align-items:center;gap:8px}
.card > h3::after{content:"";flex:1;height:1px;background:var(--linea)}

.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
label{display:block;font-size:11px;font-weight:700;color:var(--gris);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
input,select,textarea{width:100%;padding:10px 11px;border:1.5px solid var(--linea);border-radius:9px;background:#fff;outline:none;transition:.15s}
input:focus,select:focus,textarea:focus{border-color:var(--verde3);box-shadow:0 0 0 3px rgba(34,197,94,.15)}
input[readonly]{background:#f4f6f4;color:var(--gris);font-weight:700}
.mono{font-variant-numeric:tabular-nums;font-weight:700}

/* ---------- Selector de grano ---------- */
.granos{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grano{border:2px solid var(--linea);background:#fff;border-radius:12px;padding:12px 6px;cursor:pointer;text-align:center;transition:.15s;font-weight:800;letter-spacing:.5px}
.grano .ic{font-size:26px;display:block;line-height:1.2}
.grano .nm{font-size:13px;display:block}
.grano .nr{font-size:9.5px;font-weight:600;color:var(--gris);letter-spacing:.4px;display:block}
.grano:hover{border-color:#9ccdb0}
.grano.on{border-color:var(--verde2);background:#eaf7ee;color:var(--verde)}
.grano.on.soja{border-color:#65a30d;background:#f2f9e7;color:#3f6212}
.grano.on.trigo{border-color:var(--trigo);background:#fdf5e6;color:#92400e}

/* ---------- Tabla rubro ---------- */
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--linea);border-radius:10px}
table.rubro{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
table.rubro th{background:#eaf1e8;color:var(--verde);font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;padding:9px 8px;text-align:left;border-bottom:2px solid var(--linea);white-space:nowrap}
table.rubro td{padding:5px 8px;border-bottom:1px solid #eef2ee;vertical-align:middle}
table.rubro tr:last-child td{border-bottom:0}
table.rubro td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
table.rubro input{padding:7px 8px;text-align:right;font-variant-numeric:tabular-nums;font-weight:700;border-radius:7px;min-width:88px}
.tol{font-size:10.5px;color:var(--gris);font-weight:600;white-space:nowrap}
.det{font-size:10px;color:var(--trigo);font-weight:600}
tr.hay{background:#fff8ec}
tr.hay td.n{color:var(--rojo);font-weight:800}
tr.info{opacity:.72}
tfoot td{background:var(--verde);color:#fff;font-weight:800;padding:11px 8px;font-size:14px}
tfoot td.n{text-align:right;font-variant-numeric:tabular-nums;font-size:15px}

/* ---------- Totales ---------- */
.pesos{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.big{background:linear-gradient(135deg,var(--verde) 0%,var(--verde2) 100%);color:#fff;border-radius:12px;padding:12px 14px}
.big label{color:#bbe7c9}
.big .v{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.5px}

/* ---------- Acciones ---------- */
.acciones{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linea);padding:10px 12px;display:flex;gap:8px;z-index:60;box-shadow:0 -3px 14px rgba(0,0,0,.08)}
.acciones .in{max-width:1180px;margin:0 auto;display:flex;gap:8px;width:100%}
.btn{flex:1;padding:13px 10px;border:0;border-radius:11px;font-weight:800;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--verde2);color:#fff}
.btn.s{background:#e8efe7;color:var(--verde)}
.btn.g{background:#f1f5f9;color:#334155}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- Historial ---------- */
.buscar{display:flex;gap:8px;margin-bottom:12px}
.lista{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border:1px solid var(--linea);border-left:5px solid var(--verde2);border-radius:11px;padding:11px 13px;cursor:pointer;display:flex;gap:12px;align-items:center;transition:.15s}
.item.soja{border-left-color:#65a30d}.item.trigo{border-left-color:var(--trigo)}
.item:hover{box-shadow:0 3px 12px rgba(0,0,0,.09);transform:translateY(-1px)}
.item .ord{font-size:19px;font-weight:900;color:var(--verde);min-width:56px;font-variant-numeric:tabular-nums}
.item .mid{flex:1;min-width:0}
.item .cli{font-weight:800;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .meta{font-size:11.5px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .kg{text-align:right;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .kg small{display:block;font-size:10px;color:var(--gris);font-weight:700}
.chip{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.6px;padding:2px 7px;border-radius:20px;background:#eaf7ee;color:var(--verde);text-transform:uppercase}
.chip.soja{background:#f2f9e7;color:#3f6212}.chip.trigo{background:#fdf5e6;color:#92400e}
.vacio{text-align:center;color:var(--gris);padding:44px 16px}
.vacio .e{font-size:44px}

.toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%) translateY(20px);background:#14532d;color:#fff;padding:11px 20px;border-radius:24px;font-weight:700;font-size:13.5px;opacity:0;transition:.25s;z-index:200;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{background:var(--rojo)}

.notas{font-size:11px;color:var(--gris);line-height:1.55;background:#f8faf8;border-left:3px solid var(--linea);padding:9px 11px;border-radius:0 8px 8px 0;margin-top:10px}

/* ================= HOJA DE IMPRESIÓN A4 ================= */
#hoja{position:fixed;left:-10000px;top:0;width:210mm;background:#fff}
.a4{width:210mm;height:297mm;background:#fff;display:flex;flex-direction:column}
.cupon{height:148.5mm;padding:7mm 8mm 4mm;position:relative;display:flex;flex-direction:column;
       font-family:"Times New Roman",Georgia,serif;color:#000;font-size:8.6pt;line-height:1.28}
.cupon:first-child{border-bottom:1px dashed #999}
.cup-h{display:flex;align-items:center;gap:4mm;border-bottom:1.6pt solid #000;padding-bottom:1.4mm;margin-bottom:2mm}
.cup-h .lg{width:12mm;height:12mm;flex:0 0 12mm;border:1.4pt solid #000;border-radius:2mm;display:grid;place-items:center;font-size:15pt}
.cup-h .t1{font-size:17pt;font-weight:bold;letter-spacing:.4pt;line-height:1}
.cup-h .t2{font-size:7pt;letter-spacing:2.6pt;text-transform:uppercase}
.cup-h .rt{margin-left:auto;text-align:right}
.cup-h .cp{font-size:9.5pt;font-weight:bold;border:1.2pt solid #000;padding:1mm 3mm;letter-spacing:1.4pt}
.cup-h .rc{font-size:8pt;margin-top:1mm}
.cup-b{display:flex;gap:4mm;flex:1;min-height:0}
.cup-l{flex:0 0 46%}
.cup-r{flex:1;min-width:0}
.dl{display:grid;grid-template-columns:26mm 1fr;row-gap:.6mm;font-size:8.6pt}
.dl dt{font-weight:bold;text-transform:uppercase}
.dl dd{margin:0;font-weight:bold}
.dl dd.n{font-weight:normal}
#hoja table th,#hoja table td{background:transparent!important;color:#000!important}
table.pr{width:100%;border-collapse:collapse;font-size:8pt}
table.pr th,table.pr td{border:.7pt solid #000;padding:.75mm 1.3mm}
table.pr th{text-align:center;font-weight:bold;font-size:7pt;text-transform:uppercase;background:#eee!important}
table.pr td.n{text-align:right;font-variant-numeric:tabular-nums}
table.pr td.tl{font-size:6.6pt;text-align:center;color:#333!important}
table.pr tr.tot td{font-weight:bold;background:#ddd!important;font-size:8.6pt}
table.pesos{width:100%;border-collapse:collapse;font-size:9.4pt;margin-top:2.5mm}
table.pesos td{border:.9pt solid #000;padding:1.1mm 2mm}
table.pesos td.l{font-weight:bold;text-transform:uppercase;width:32mm}
table.pesos td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:bold}
table.pesos tr.fin td{background:#ddd!important;font-size:10.5pt}
.obs{font-size:7.2pt;margin-top:2mm;border:.6pt solid #999;padding:1mm 1.5mm;min-height:8mm}
.norma-box{font-size:6.4pt;line-height:1.35;margin-top:2mm;text-align:justify;color:#222!important}
.firmas{display:flex;gap:6mm;margin-top:auto;padding-top:4mm;font-size:7pt;text-align:center}
.firmas div{flex:1;border-top:.8pt solid #000;padding-top:.8mm}
.pie{font-size:6.4pt;text-align:center;margin-top:1.2mm;color:#333!important}

@media print{
  body>*:not(#hoja){display:none!important}
  #hoja{position:static!important;left:0!important}
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff}
  .cupon:first-child{border-bottom:1px dashed #666}
}
@media (max-width:520px){
  .top h1{font-size:17px}.estado{display:none}
  .tabs{top:64px}
  .btn{font-size:13px;padding:12px 6px}
  .big .v{font-size:22px}
}
</style>
</head>
<body>

<div class="top">
  <div class="marca">
    <div class="logo">🌾</div>
    <div>
      <h1>Visión Agropecuaria</h1>
      <div class="sub">Descargas de campo</div>
    </div>
    <div class="estado"><span class="dot" id="dot"></span><span id="estadoTxt">Conectando…</span></div>
  </div>
</div>

<div class="tabs">
  <button id="tabCarga" class="on" onclick="verTab('carga')">➕ Nueva descarga</button>
  <button id="tabHist" onclick="verTab('hist')">📋 Historial</button>
</div>

<!-- ==================== CARGA ==================== -->
<div class="wrap" id="vCarga">

  <div class="card">
    <h3>Grano</h3>
    <div class="granos">
      <div class="grano maiz on" data-g="maiz" onclick="setGrano('maiz')">
        <span class="ic">🌽</span><span class="nm">MAÍZ</span><span class="nr">Norma XII</span></div>
      <div class="grano soja" data-g="soja" onclick="setGrano('soja')">
        <span class="ic">🫘</span><span class="nm">SOJA</span><span class="nr">Norma XVII</span></div>
      <div class="grano trigo" data-g="trigo" onclick="setGrano('trigo')">
        <span class="ic">🌾</span><span class="nm">TRIGO</span><span class="nr">Norma XX</span></div>
    </div>
  </div>

  <div class="card">
    <h3>Datos de la descarga</h3>
    <div class="grid">
      <div><label>Orden N°</label><input id="f_orden" class="mono" type="number" inputmode="numeric" oninput="ORDEN_AUTO=false"></div>
      <div><label>N° de CTG</label><input id="f_ctg" class="mono" inputmode="numeric" placeholder="10133418636"></div>
      <div><label>Fecha y hora</label><input id="f_fecha" type="datetime-local"></div>
      <div style="grid-column:span 2"><label>Nombre del cliente</label><input id="f_cliente" placeholder="Apellido y nombre / Razón social" autocomplete="off"></div>
      <div><label>Patente camión</label><input id="f_pat" style="text-transform:uppercase" placeholder="EGO101" autocomplete="off"></div>
      <div><label>Patente acoplado</label><input id="f_aco" style="text-transform:uppercase" placeholder="TON029" autocomplete="off"></div>
    </div>
  </div>

  <div class="card">
    <h3>Pesada</h3>
    <div class="grid">
      <div><label>Bruto (Kg)</label><input id="f_bruto" class="mono" type="number" inputmode="numeric" placeholder="45240" oninput="recalc()"></div>
      <div><label>Tara (Kg)</label><input id="f_tara" class="mono" type="number" inputmode="numeric" placeholder="14260" oninput="recalc()"></div>
      <div><label>Neto (Kg)</label><input id="f_neto" class="mono" readonly></div>
    </div>
  </div>

  <div class="card">
    <h3><span id="tituloRubro">Rubro — Maíz</span></h3>
    <div class="grid" style="margin-bottom:12px" id="boxGrado">
      <div><label>Grado base (tolerancias)</label>
        <select id="f_grado" onchange="recalc()"><option value="1">Grado 1</option><option value="2" selected>Grado 2</option><option value="3">Grado 3</option></select></div>
      <div><label>Grado resultante</label><input id="f_gradoAuto" readonly class="mono"></div>
    </div>
    <div class="tablewrap">
      <table class="rubro">
        <thead><tr>
          <th style="width:38%">Rubro</th><th style="width:20%">Cont. medido</th>
          <th style="width:16%">Tolerancia</th><th class="n" style="width:13%">Deducción %</th><th class="n" style="width:13%">Merma Kg</th>
        </tr></thead>
        <tbody id="tbRubro"></tbody>
        <tfoot><tr>
          <td colspan="3">TOTAL DESCONTADO</td>
          <td class="n" id="tPct">0,00 %</td><td class="n" id="tKg">0</td>
        </tr></tfoot>
      </table>
    </div>
    <div class="notas" id="notas"></div>
  </div>

  <div class="card">
    <h3>Resultado</h3>
    <div class="pesos">
      <div class="big"><label>Neto de balanza</label><div class="v" id="rNeto">0</div></div>
      <div class="big" style="background:linear-gradient(135deg,#b45309,#d97706)"><label>Total descontado</label><div class="v" id="rMerma">0</div></div>
      <div class="big" style="background:linear-gradient(135deg,#166534,#22c55e)"><label>Kilos netos</label><div class="v" id="rKilos">0</div></div>
    </div>
    <div style="margin-top:10px"><label>Observaciones</label><textarea id="f_obs" rows="2" placeholder="Opcional"></textarea></div>
  </div>
</div>

<!-- ==================== HISTORIAL ==================== -->
<div class="wrap" id="vHist" style="display:none">
  <div class="buscar">
    <input id="q" placeholder="🔎 Buscar por cliente, CTG, orden o patente…" oninput="pintarLista()">
    <select id="fg" onchange="pintarLista()" style="max-width:130px">
      <option value="">Todos</option><option value="maiz">Maíz</option><option value="soja">Soja</option><option value="trigo">Trigo</option>
    </select>
  </div>
  <div class="card" id="resumen" style="padding:12px"></div>
  <div class="lista" id="lista"></div>
</div>

<div class="acciones">
  <div class="in" id="accCarga">
    <button class="btn g" onclick="nuevo()">✚ Nueva</button>
    <button class="btn s" onclick="imprimir()">🖨 Imprimir</button>
    <button class="btn s" onclick="descargarPDF()">⬇ PDF</button>
    <button class="btn p" id="btnGuardar" onclick="guardar()">💾 Guardar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Hoja A4: Original + Duplicado -->
<div id="hoja"><div class="a4"><div class="cupon" id="cup1"></div><div class="cupon" id="cup2"></div></div></div>

<script>
/* ============================================================
   VISIÓN AGROPECUARIA — Normativas de calidad
   Maíz  : Norma XII
   Soja  : Norma XVII
   Trigo : Norma XX
   Tablas de merma por secado reconstruidas de las planillas.
   ============================================================ */

/* Merma por secado (%) — fórmulas equivalentes a las tablas impresas */
function mermaSecado(grano, h) {
  h = Number(h);
  if (!isFinite(h)) return 0;
  if (grano === 'soja') {
    if (h <= 13.5) return 0;
    if (h > 25) h = 25;
    return (h - 13.0) / 0.87;          // tabla SOJA: 13,6→0,69 … 25,0→13,79
  }
  if (grano === 'trigo') {
    if (h <= 14.0) return 0;
    if (h > 25) h = 25;
    return (h - 13.5) / 0.865;         // tabla TRIGO: 14,10→0,69 … 25,00→13,29
  }
  // maiz
  if (h <= 14.5) return 0;
  if (h > 25) h = 25;
  return (h - 13.5) / 0.865;           // tabla MAIZ: 14,6→1,27 … 25,0→13,29
}

const MANIPULEO = { maiz: 0.25, soja: 0.25, trigo: 0.10 };

/* Rebaja escalonada (soja) — acumulativa por tramos */
function tramos(valor, base, escalas) {
  let d = 0;
  for (const [desde, hasta, factor] of escalas) {
    if (valor > desde) d += (Math.min(valor, hasta) - desde) * factor;
  }
  return d;
}

const NORMAS = {
  maiz: {
    nombre: 'MAÍZ',
    producto: 'MAIZ DURO',
    norma: 'NORMA XII — Norma de calidad para la comercialización de maíz',
    tipos: 'DUROS / DENTADO — Color: colorado, amarillo, blanco',
    conGrados: true,
    grados: [1, 2, 3],
    gradoBase: 2,
    humedadBase: 14.5,
    rubros: [
      { key: 'peso_hl',  label: 'PESO HECTOLITRICO', unidad: 'Kg/hl', tipo: 'min',
        tol: { 1: 75, 2: 72, 3: 69 }, factor: 1.00,
        nota: '1,00 % de descuento por cada Kg. faltante de P.H.' },
      { key: 'danados',  label: 'GRANOS DAÑADOS', unidad: '%', tipo: 'max',
        tol: { 1: 3.00, 2: 5.00, 3: 8.00 }, factor: 1.00 },
      { key: 'quebrados', label: 'GRANOS QUEBRADOS', unidad: '%', tipo: 'max',
        tol: { 1: 2.00, 2: 3.00, 3: 5.00 }, factor: 0.25 },
      { key: 'mat_ext',  label: 'MATERIAS EXTRAÑAS', unidad: '%', tipo: 'max',
        tol: { 1: 1.00, 2: 1.50, 3: 2.00 }, factor: 1.00 },
      { key: 'tipo',     label: 'TIPO', unidad: '%', tipo: 'max',
        tol: { 1: 5.00, 2: 5.00, 3: 5.00 }, factor: 0.25 },
      { key: 'color',    label: 'COLOR', unidad: '%', tipo: 'max',
        tol: { 1: 5.00, 2: 5.00, 3: 5.00 }, factor: 0.25 },
      { key: 'picados',  label: 'GRANOS PICADOS', unidad: '%', tipo: 'max',
        tol: { 1: 3.00, 2: 3.00, 3: 3.00 }, factor: 1.00 },
      { key: 'humedad',  label: 'HUMEDAD', unidad: '%', tipo: 'humedad',
        tol: { 1: 14.5, 2: 14.5, 3: 14.5 },
        nota: 'Merma por secado según tabla + 0,25 % de manipuleo' },
      { key: 'chamico',  label: 'CHAMICO (sem./100 g)', unidad: 'sem', tipo: 'semillas',
        tol: { 1: 2, 2: 2, 3: 2 }, fijo: 1.30,
        nota: 'Excedido: 1,3 % de merma de peso y gastos de zarandeo' },

/* ---------- Motor de cálculo ---------- */
function calcularRubros(grano, grado, valores, neto) {
  const n = NORMAS[grano];
  const filas = [];
  let totalPct = 0;

  for (const r of n.rubros) {
    const raw = valores[r.key];
    const tiene = raw !== '' && raw !== undefined && raw !== null && isFinite(Number(raw));
    const v = tiene ? Number(raw) : null;
    let pct = 0, detalle = '', tolTxt = '';

    if (r.tipo === 'min') {
      tolTxt = 'mín. ' + fmt(r.tol[grado]) + ' ' + r.unidad;
      if (tiene && v < r.tol[grado]) {
        const falt = r.tol[grado] - v;
        pct = falt * r.factor;
        detalle = 'faltan ' + fmt(falt) + ' Kg/hl × ' + fmt(r.factor) + ' %';
      }
    } else if (r.tipo === 'max') {
      tolTxt = 'máx. ' + fmt(r.tol[grado]) + ' %';
      if (tiene && v > r.tol[grado]) {
        const exc = v - r.tol[grado];
        pct = exc * r.factor;
        detalle = 'excede ' + fmt(exc) + ' % × ' + fmt(r.factor) + ' %';
      }
    } else if (r.tipo === 'tramos') {
      tolTxt = 'base ' + fmt(r.base) + ' %';
      if (tiene && v > r.base) {
        pct = tramos(v, r.base, r.escalas);
        detalle = 'excede ' + fmt(v - r.base) + ' %';
      }
    } else if (r.tipo === 'humedad') {
      const base = n.humedadBase;
      tolTxt = 'base ' + fmt(base) + ' %';
      if (tiene && v > base) {
        const sec = mermaSecado(grano, v);
        const man = MANIPULEO[grano];
        pct = sec + man;
        detalle = 'secado ' + fmt2(sec) + ' % + manipuleo ' + fmt2(man) + ' %';
      }
    } else if (r.tipo === 'semillas') {
      const tol = r.tol ? r.tol[grado] : r.recibo;
      tolTxt = 'máx. ' + fmt(tol) + ' sem.';
      if (tiene && v > tol) { pct = r.fijo; detalle = 'excedido → ' + fmt(r.fijo) + ' % fijo'; }
    } else {
      tolTxt = r.recibo !== undefined ? 'tol. ' + fmt(r.recibo) : '—';
    }

    if (pct < 0) pct = 0;
    const kg = neto > 0 ? neto * pct / 100 : 0;
    totalPct += pct;
    filas.push({
      key: r.key, label: r.label, unidad: r.unidad, tipo: r.tipo,
      cont: tiene ? v : null, tolTxt, pct, kg, detalle, nota: r.nota || ''
    });
  }

  const totalKg = neto > 0 ? Math.round(neto * totalPct / 100) : 0;
  return { filas, totalPct, totalKg, kilosNetos: Math.max(0, Math.round(neto) - totalKg) };
}

function gradoAutomatico(grano, valores) {
  const n = NORMAS[grano];
  if (!n.conGrados) return null;
  for (const g of n.grados) {
    let ok = true;
    for (const r of n.rubros) {
      const v = Number(valores[r.key]);
      if (valores[r.key] === '' || valores[r.key] === undefined || !isFinite(v)) continue;
      if (r.tipo === 'min' && v < r.tol[g]) ok = false;
      if (r.tipo === 'max' && v > r.tol[g]) ok = false;
    }
    if (ok) return g;
  }
  return 'F/E';
}

function fmt(x)  { return Number(x).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmt2(x) { return Number(x).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtKg(x){ return Math.round(Number(x)).toLocaleString('es-AR').replace(/,/g, '.'); }

function pintarHoja(){
  const d = EDIT_ID ? (DATOS.find(x => x.id === EDIT_ID) || leerForm()) : leerForm();
  if (EDIT_ID && !DATOS.find(x => x.id === EDIT_ID)) { /* usa el form */ }
  const dd = leerForm(); if (EDIT_ID) dd.orden = +$('f_orden').value;
  $('cup1').innerHTML = cuponHTML(dd, 'ORIGINAL');
  $('cup2').innerHTML = cuponHTML(dd, 'DUPLICADO');
  return dd;
}

function imprimir(){
  if (!$('f_cliente').value.trim()) { toast('Falta el nombre del cliente', true); return; }
  pintarHoja(); setTimeout(() => window.print(), 120);
}

async function descargarPDF(){
  if (!$('f_cliente').value.trim()) { toast('Falta el nombre del cliente', true); return; }
  const d = pintarHoja();
  toast('Generando PDF…');
  try{
    const el = document.querySelector('#hoja .a4');
    const canvas = await html2canvas(el, { scale: 2.6, backgroundColor: '#fff', useCORS: true, windowWidth: el.scrollWidth });
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
    pdf.addImage(canvas.toDataURL('image/jpeg', 0.94), 'JPEG', 0, 0, 210, 297);
    const nom = 'Descarga_' + String(d.orden).padStart(4,'0') + '_' + (d.cliente || 'cliente').replace(/[^\w\sáéíóúÁÉÍÓÚñÑ-]/g,'').trim().replace(/\s+/g,'_') + '.pdf';
    pdf.save(nom);
    toast('✔ PDF descargado');
  } catch(e){ console.error(e); toast('No se pudo generar el PDF. Usá Imprimir → Guardar como PDF.', true); }
}

/* ---------- Realtime (los demás dispositivos ven los cambios) ---------- */
function realtime(){
  try{
    const ws = new WebSocket(SB_URL.replace('https','wss') + '/realtime/v1/websocket?apikey=' + SB_KEY + '&vsn=1.0.0');
    let ref = 0;
    ws.onopen = () => {
      ws.send(JSON.stringify({ topic:'realtime:public:descargas', event:'phx_join', ref:String(++ref),
        payload:{ config:{ postgres_changes:[{ event:'*', schema:'public', table:'descargas' }] } } }));
      setInterval(() => { if (ws.readyState === 1) ws.send(JSON.stringify({topic:'phoenix',event:'heartbeat',payload:{},ref:String(++ref)})); }, 25000);
    };
    ws.onmessage = ev => { const m = JSON.parse(ev.data); if (m.event === 'postgres_changes') cargar(); };
    ws.onclose = () => setTimeout(realtime, 6000);
  } catch(e){ /* fallback al polling */ }
}

/* ---------- Init ---------- */
setGrano('maiz');
$('f_fecha').value = ahoraLocal();
cargar().then(() => { if (!$('f_orden').value) $('f_orden').value = proximoOrden(); });
realtime();
setInterval(() => { if (document.visibilityState === 'visible') cargar(); }, 30000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') cargar(); });
