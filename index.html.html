<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#14532d">
<title>Visión Agropecuaria — Descargas de granos</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#127806;</text></svg>">
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;background:#f1f5f0;color:#14201a;
       font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;text-align:center;padding:24px}
  .lg{font-size:52px;line-height:1}
  h1{font-size:19px;font-weight:800;margin:14px 0 4px;color:#14532d}
  p{font-size:13.5px;color:#64748b;margin:0}
  a{color:#166534;font-weight:700}
  .sp{width:26px;height:26px;margin:18px auto 0;border:3px solid #d5ded3;border-top-color:#22c55e;
      border-radius:50%;animation:g .8s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div id="cargando">
    <div class="lg">&#127806;</div>
    <h1>Visión Agropecuaria</h1>
    <p id="msg">Cargando el sistema de descargas…</p>
    <div class="sp" id="sp"></div>
  </div>
<script>
(async function () {
  var APP = "https://powygqcmgzqxfwdzfybu.supabase.co/functions/v1/app";
  try {
    var r = await fetch(APP + "?v=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error("HTTP " + r.status);
    var html = new TextDecoder("utf-8").decode(await r.arrayBuffer());
    if (html.indexOf("<") === -1) throw new Error("respuesta vacía");
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    var sp = document.getElementById("sp");
    if (sp) sp.style.display = "none";
    document.getElementById("msg").innerHTML =
      "No se pudo cargar la app (" + e.message + ").<br><br>" +
      "Probá de nuevo en un minuto, o abrila directo desde " +
      "<a href='" + APP + "'>este link</a>.";
  }
})();
</script>
</body>
</html>
